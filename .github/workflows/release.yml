name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r outputs/c6_streamlit_app/requirements.txt pyinstaller xlrd
      - name: Validar tag e versao
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $version = python -c "import sys; sys.path.insert(0, 'outputs/c6_streamlit_app'); from app_version import __version__; print(__version__)"
          if ($tag -ne $version) { throw "Git tag version v$tag does not match application version $version" }
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Compilar aplicativo
        working-directory: outputs/c6_streamlit_app
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name AutoC6Bank --icon app_icon.ico --add-data "brand_imperio.png;." --add-data "brand_c6.png;." desktop_app.py
          pyinstaller --noconfirm --clean --onefile --windowed --name AutoC6BankUpdater --add-data "app_version.py;." updater_app.py
      - name: Gerar checksum
        shell: pwsh
        working-directory: outputs/c6_streamlit_app
        run: |
          $dist = (Resolve-Path "dist").Path
          $app = Join-Path $dist "AutoC6Bank.exe"
          $updater = Join-Path $dist "AutoC6BankUpdater.exe"
          if (!(Test-Path -LiteralPath $app) -or !(Test-Path -LiteralPath $updater)) {
            throw "Executaveis esperados nao foram encontrados para gerar os checksums."
          }
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          $hash = (Get-FileHash -LiteralPath $app -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$app.sha256", "$hash  AutoC6Bank.exe", $utf8NoBom)
          $updaterHash = (Get-FileHash -LiteralPath $updater -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$updater.sha256", "$updaterHash  AutoC6BankUpdater.exe", $utf8NoBom)
          Get-Item -LiteralPath "$app.sha256", "$updater.sha256" | Format-Table Name, Length
      - name: Criar release e anexar todos os assets
        shell: pwsh
        working-directory: outputs/c6_streamlit_app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/AutoC6Bank.exe" `
            "dist/AutoC6Bank.exe.sha256" `
            "dist/AutoC6BankUpdater.exe" `
            "dist/AutoC6BankUpdater.exe.sha256" `
            --title "Auto C6BANK ${{ github.ref_name }}" `
            --generate-notes
